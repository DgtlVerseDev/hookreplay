name: product-ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Record immutable revision subject
        run: |
          printf 'event=%s\n' "$GITHUB_EVENT_NAME"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          git rev-parse HEAD
          git status --porcelain=v1
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Assert no write credential persisted by checkout
        shell: bash
        run: |
          if git config --local --get-all http.https://github.com/.extraheader; then
            echo 'checkout credential unexpectedly persisted' >&2
            exit 1
          fi
