[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hookreplay"
version = "0.1.0"
description = "Record GitHub webhook bytes and replay them locally"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
hookreplay = "hookreplay.cli:main"

[tool.setuptools.packages.find]
include = ["hookreplay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
